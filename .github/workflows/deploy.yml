name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab19-cloud
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get source code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install dependencies from lock file
        run: npm ci --no-audit --no-fund
      - name: Run tests before build
        run: npm run test
      - name: Build NestJS
        run: npm run build
      - name: Build production Docker image
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" -t veb-lab19:optimized .
      - name: Check API with PostgreSQL in Docker
        run: npm run test:e2e
        env:
          EXPECTED_VERSION: ${{ github.sha }}
      - name: Prepare registry image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag veb-lab19:optimized "$IMAGE:$GITHUB_SHA"
          docker tag veb-lab19:optimized "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
      - name: Deploy tested image to Codespaces
        id: deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: node scripts/codespace.cjs deploy
      - name: Verify deployed version and database
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.public_url }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: npm run verify:deploy
      - name: Stop local test containers
        if: always()
        run: if [ -f .env ]; then docker compose down; fi
