name: veb-lab19

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Создайте .env командой npm run configure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте пароль базы}
      POSTGRES_DB: ${POSTGRES_DB:?Задайте имя базы}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: veb-lab19:optimized
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Задайте случайный секрет JWT}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Задайте учебный пароль admin}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Задайте учебный пароль student}
    ports:
      - "127.0.0.1:${APP_PORT:-3006}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node dist/seed.js && exec node dist/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
